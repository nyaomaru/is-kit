name: Deno Smoke Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  deno-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run JSR smoke test
        run: deno run --no-lock tests/deno-smoke.ts
