name: Publish to npm

on:
  push:
    tags: ['v*.*.*']

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test

      - name: Build package
        run: mise run build

      - name: Smoke-test package artifact
        run: mise run test-package

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # WHY: npm Trusted Publishing requires npm 11.5.1 or later. Set up
      # Node 24 after mise so its bundled npm remains first on PATH.
      - name: Setup Node for trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Publish to npm
        run: npm publish --access public --ignore-scripts
