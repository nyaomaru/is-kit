name: Publish to JSR
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      # WHY: `npx jsr` makes HTTPS requests; this floor includes Node's
      # eMudhra CA distrust update.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Publish package
        run: npx jsr publish --allow-slow-types --allow-dirty
      - name: Smoke-test published package
        env:
          IS_KIT_VERSION: ${{ github.ref_name }}
        # WHY: This smoke test imports the version just published above, so it
        # must bypass the dependency-age delay for this invocation.
        run: deno run --no-lock --minimum-dependency-age=0 --allow-env=IS_KIT_VERSION --allow-import=jsr.io tests/deno-published-smoke.ts
