name: Publish to JSR
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish package
        run: npx jsr publish --allow-slow-types --allow-dirty
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Smoke-test published package
        env:
          IS_KIT_VERSION: ${{ github.ref_name }}
        run: deno run --no-lock --allow-env=IS_KIT_VERSION --allow-import=jsr.io tests/deno-published-smoke.ts
