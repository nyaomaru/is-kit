name: Feature request
description: Suggest a new API or an improvement to existing behavior.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. A rough idea is enough to start the discussion.

  - type: textarea
    id: problem
    attributes:
      label: Idea or use case
      description: Describe your idea, the problem you want to solve, or the use case you have in mind.
      placeholder: What would you like is-kit to support or improve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: If you have a concrete API in mind, show how you would like it to work.
      placeholder: |
        ```ts
        import { proposedGuard } from 'is-kit';

        // Example of the proposed API
        ```
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative designs you considered.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other information that may help evaluate the proposal.
