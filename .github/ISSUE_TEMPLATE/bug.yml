name: Bug report
description: Report incorrect runtime behavior or type inference.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Fill in what you know; partial reports are welcome.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem and what you were trying to do.
      placeholder: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: If possible, provide a small code sample or TypeScript Playground link that reproduces the issue.
      placeholder: |
        ```ts
        import { isNumber } from 'is-kit';

        // Minimal code that reproduces the issue
        ```
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Explain what happens, including any runtime or TypeScript errors.
      placeholder: What happened?
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Explain what you expected to happen.
      placeholder: What should have happened?
  - type: input
    id: is-kit-version
    attributes:
      label: is-kit version
      description: Provide this if you know it.
      placeholder: 1.12.0

  - type: input
    id: typescript-version
    attributes:
      label: TypeScript version
      description: Leave this blank if the issue is unrelated to TypeScript types.
      placeholder: 6.0.3

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Leave this blank if the issue is unrelated to Node.js.
      placeholder: 22.22.0

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other relevant information, such as your package manager, operating system, or screenshots.
